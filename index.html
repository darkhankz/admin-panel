<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coursee Admin</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
	<div class="brand">🎓 <b>Coursee</b> Admin</div>
	<nav class="tabs">
		<button class="tab-btn active" data-tab="stats">📊 Аналитика</button>
		<button class="tab-btn" data-tab="publish">➕ Опубликовать</button>
		<button class="tab-btn" data-tab="videos">🎬 Видео</button>
		<button class="tab-btn" data-tab="categories">📁 Категории</button>
	</nav>
</header>

<main>
	<!-- АНАЛИТИКА -->
	<section id="tab-stats" class="tab active">
		<div class="cards-row" id="statsCards"></div>
		<div class="panel">
			<h3>Добавления за 14 дней</h3>
			<div id="chartByDay" class="chart"></div>
		</div>
		<div class="panel">
			<h3>По категориям</h3>
			<div id="statsByCat"></div>
		</div>
		<div class="panel">
			<h3>🏆 Топ-10 по просмотрам</h3>
			<div id="statsTopViews"></div>
		</div>
		<div class="panel">
			<h3>👁 Просмотры по категориям</h3>
			<div id="statsViewsByCat"></div>
		</div>
	</section>

	<!-- ОПУБЛИКОВАТЬ -->
	<section id="tab-publish" class="tab">
		<div class="panel narrow">
			<h3>Новое видео</h3>
			<label>Ссылка YouTube *</label>
			<input id="pubUrl" type="url" placeholder="https://www.youtube.com/watch?v=...">
			<div id="pubPreview" class="preview hidden">
				<img id="pubThumb" alt="">
				<div id="pubPreviewInfo" class="muted"></div>
			</div>
			<label>Категория *</label>
			<select id="pubCategory"></select>
			<label>Название (пусто = возьмётся с YouTube)</label>
			<input id="pubTitle" type="text" placeholder="Автоматически с YouTube">
			<label>Описание * (обязательно, не подтягивается с YouTube)</label>
			<textarea id="pubDesc" rows="4" placeholder="Введите описание вручную"></textarea>
			<label class="checkbox"><input id="pubTg" type="checkbox" checked> Отправить пост в Telegram-канал</label>
			<button id="pubBtn" class="btn primary">Опубликовать</button>
			<div id="pubResult" class="result"></div>
		</div>
	</section>

	<!-- ВИДЕО -->
	<section id="tab-videos" class="tab">
		<div class="toolbar">
			<input id="vSearch" type="search" placeholder="Поиск по названию...">
			<select id="vCatFilter"><option value="">Все категории</option></select>
		</div>
		<div id="videoList" class="video-list"></div>
		<button id="vMore" class="btn hidden">Загрузить ещё</button>
	</section>

	<!-- КАТЕГОРИИ -->
	<section id="tab-categories" class="tab">
		<div class="panel">
			<div class="row-between">
				<h3>Категории</h3>
				<button id="normBtn" class="btn">🧹 Нормализовать категории</button>
			</div>
			<div id="catGrid" class="cat-grid"></div>
			<div id="catRaw" class="raw-box"></div>
		</div>
	</section>
</main>

<!-- МОДАЛКА РЕДАКТИРОВАНИЯ -->
<div id="modal" class="modal hidden">
	<div class="modal-box">
		<h3>Редактировать видео</h3>
		<img id="mThumb" class="modal-thumb" alt="">
		<label>Название</label>
		<input id="mTitle" type="text">
		<label>Описание</label>
		<textarea id="mDesc" rows="5"></textarea>
		<label>Категория</label>
		<select id="mCategory"></select>
		<div class="modal-actions">
			<button id="mCancel" class="btn">Отмена</button>
			<button id="mSave" class="btn primary">Сохранить</button>
		</div>
	</div>
</div>

<div id="toast" class="toast hidden"></div>
<script src="app.js"></script>
</body>
</html>
